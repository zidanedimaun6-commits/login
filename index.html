<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU -->
    <nav>
        <h2>MyWebsite</h2>

        <div class="menu">
            <a href="#" onclick="showPage('home')">Home</a>
            <a href="#" onclick="showPage('about')">About</a>
            <a href="#" onclick="showPage('contact')">Contact</a>

            <button id="loginMenu" onclick="showPage('login')">
                Login
            </button>

            <button id="logoutMenu" onclick="logout()" style="display:none;">
                Logout
            </button>
        </div>
    </nav>


    <!-- HOME -->
    <section id="home" class="page">
        <h1>Welcome to My Website</h1>
        <p id="welcomeText">Please login to continue.</p>
    </section>


    <!-- ABOUT -->
    <section id="about" class="page" style="display:none;">
        <h1>About</h1>
        <p>This is my website.</p>
    </section>


    <!-- CONTACT -->
    <section id="contact" class="page" style="display:none;">
        <h1>Contact</h1>
        <p>Email: example@gmail.com</p>
    </section>


    <!-- LOGIN -->
    <section id="login" class="page" style="display:none;">

        <div class="box">
            <h1>Login</h1>

            <input type="text" id="loginUsername" placeholder="Username">

            <input type="password" id="loginPassword" placeholder="Password">

            <button onclick="login()">Login</button>

            <p>
                Don't have an account?
                <a href="#" onclick="showPage('register')">
                    Create Account
                </a>
            </p>

            <p id="loginMessage"></p>
        </div>

    </section>


    <!-- CREATE ACCOUNT -->
    <section id="register" class="page" style="display:none;">

        <div class="box">
            <h1>Create Account</h1>

            <input type="text" id="registerUsername" placeholder="Username">

            <input type="email" id="registerEmail" placeholder="Email">

            <input type="password" id="registerPassword" placeholder="Password">

            <input type="password" id="confirmPassword" placeholder="Confirm Password">

            <button onclick="register()">Create Account</button>

            <p>
                Already have an account?
                <a href="#" onclick="showPage('login')">
                    Login
                </a>
            </p>

            <p id="registerMessage"></p>
        </div>

    </section>


    <script src="script.js"></script>
</body>
</html>
